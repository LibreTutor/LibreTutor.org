  <!-- S-02: import map — remapa el import ESM de lit-core (lit-components.js no se toca) a la copia vendored + pin (lit 3.3.3 ≡ dist@3).
       Nota: import maps no soportan SRI (limitación documentada — el pin por nombre/version cubre el rol) -->


  <!-- Hoja de Estilos Personalizados (Madera Rústica, Herrajes y Marcadores) -->

  <!-- LB-23: Tailwind COMPILADO (3.4.19, pin exacto; sin CDN). Fuente: css/tailwind.input.css + tailwind.config.mjs + css/tokens.css

<body class="relative w-screen h-screen overflow-hidden select-none">

  <!-- ======================================================================= -->
  <!-- LIENZO WEBGL 3D DE BABYLON.JS (v0.2.1: PLANETA 3D + METRO L1/L2/L3)     -->
  <!-- ======================================================================= -->
  <canvas id="babylon-panama-canvas" role="img" aria-label="Mapa 3D interactivo del Istmo de Panamá: arrastra para girar, usa los botones de zoom y giro del panel inferior" class="absolute inset-0 w-full h-full outline-none cursor-grab active:cursor-grabbing z-0"></canvas>

  <!-- S-03: boot error boundary — fallback visible si WebGL/CDN falla (el UI Lit sigue funcional). -->
  <!-- Oculto por defecto (hidden + display:none); main.js lo muestra en el catch. -->
  <div id="lt-webgl-fallback" class="lt-webgl-fallback" hidden>
    <div class="lt-webgl-fallback-card">
      <p class="lt-webgl-fallback-title">WebGL no disponible — el mapa 3D no pudo cargarse</p>
      <p class="lt-webgl-fallback-cause" id="lt-webgl-fallback-cause"></p>
    </div>
  </div>

  <!-- CAPA DE NOMBRES LIMPIOS + HOVER CARDS + MICRO-ETIQUETAS DE INFRAESTRUCTURA (60 FPS) -->
  <div id="projected-labels-layer" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>
  <div id="projected-micro-landmarks" class="absolute inset-0 pointer-events-none z-10 overflow-hidden"></div>

  <!-- ======================================================================= -->
  <!-- WEB COMPONENTS REACTIVOS DE LIT (v0.2.1 • HUD, GUÍA Y MODALES)          -->
  <!-- ======================================================================= -->
  <lt-top-hud id="ui-top-hud"></lt-top-hud>
  <lt-park-guide id="ui-park-guide"></lt-park-guide>
  <lt-bottom-dock id="ui-bottom-dock"></lt-bottom-dock>
  <lt-lesson-modal id="ui-lesson-modal"></lt-lesson-modal>
